name: Check Version

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  check_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - id: current_gcloud_sdk_version
        name: Get current gcloud-sdk version
        run: echo "version=$(cat ./gcloud_sdk_version.txt)" >> $GITHUB_OUTPUT
      - name: Show current version
        env:
          CURRENT_VERSION: ${{ steps.current_gcloud_sdk_version.outputs.version }}
        run: printf '%s\n' "$CURRENT_VERSION"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Get latest gcloud-sdk version
        id: latest_gcloud_sdk_version
        run: |
          LATEST_VERSION="$(go run ./cmd/get-latest-version)"
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
      - name: Show latest version
        env:
          LATEST_VERSION: ${{ steps.latest_gcloud_sdk_version.outputs.version }}
        run: printf '%s\n' "$LATEST_VERSION"
      - name: Create pull-request if new version is published
        if: ${{ steps.current_gcloud_sdk_version.outputs.version != steps.latest_gcloud_sdk_version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ steps.current_gcloud_sdk_version.outputs.version }}
          NEW_VERSION: ${{ steps.latest_gcloud_sdk_version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$NEW_VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid version: $NEW_VERSION" >&2
            exit 1
          fi

          printf '%s\n' "$NEW_VERSION" > ./gcloud_sdk_version.txt
          UNDERSCORED_NEW_VERSION="${NEW_VERSION//./_}"
          BRANCH="gcloud_sdk_version_${UNDERSCORED_NEW_VERSION}"
          git switch -c "$BRANCH"
          git add ./gcloud_sdk_version.txt

          git config user.name github-actions
          git config user.email github-actions@github.com
          COMMIT_MESSAGE="update gcloud-sdk version to $NEW_VERSION"
          git commit -m "$COMMIT_MESSAGE"
          git push origin "$BRANCH"

          gh pr create -B main -H "$BRANCH" -t "$COMMIT_MESSAGE" -b "Update from $CURRENT_VERSION to $NEW_VERSION"
